buildscript {
    ext {
        // Versione di Kotlin compatibile con AGP 7.2.0 e Gradle 7.3.3
        kotlin_version = '1.7.10'
        // Versione di Hilt compatibile con AGP 7.2.0
        hilt_version = '2.42'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath 'com.google.gms:google-services:4.3.15'

        // Versione fissa senza variabile per evitare errori di parsing:
        classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.5.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    materialVersion = '1.3.0'
    fragmentsVersion = "1.3.0"
    appCompatVersion = '1.2.0'
    constraintLayoutVersion = '2.0.4'
    legacySupportVersion = '1.0.0'
    junitVersion = '4.13.2'
    espressoVersion = '3.3.0'
    textExtVersion = '1.1.2'

    roomVersion = '2.2.5'
    archLifecycleVersion = '2.2.0'
    recyclerVersion = '1.1.0'
    navigationVersion='2.3.5'
    cardViewVersion = '1.0.0'
    lifecycleVersion = '2.2.0'
    recyclerViewVersion = '1.0.0'

    coreTestingVersion = '2.1.0'
    androidxJunitVersion = '1.1.2'
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 31
            }
        }
    }
}